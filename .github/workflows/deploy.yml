name: Deploy Laravel to aaPanel

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=3 \
              -o ConnectTimeout=30 \
              -p ${{ secrets.SSH_PORT }} \
              ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash << 'ENDSSH'
          set -e
          
          # Configuração do Git
          git config --global --add safe.directory /www/wwwroot/sistema.ghpu.com.br

          # Configuração de PATH
          export PATH=/usr/local/node/bin:/usr/local/bin:/www/server/php/81/bin:$PATH
          export NODE_PATH=/usr/local/node/lib/node_modules:$NODE_PATH

          # Navegar para o diretório do projeto
          cd /www/wwwroot/sistema.ghpu.com.br

          # Pull do GitHub
          echo "🚀 Atualizando código do GitHub..."
          git pull origin main

          # Instalar dependências PHP
          echo "📦 Instalando dependências PHP..."
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

          # Instalar dependências Node
          echo "📦 Instalando dependências Node..."
          npm ci --production=false
          
          # Build dos assets
          echo "🏗️ Compilando assets..."
          npm run build

          # Ajustar permissões
          echo "🔧 Ajustando permissões..."
          chmod -R 775 storage bootstrap/cache
          chown -R www:www storage bootstrap/cache

          # Otimizar Laravel
          echo "🧹 Otimizando Laravel..."
          php artisan storage:link --force

          echo "⚙️ Rebuilding caches"
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache

          echo "🧹 Limpando caches"
          php artisan optimize:clear

          echo "🚀 Deploy finalizado!"
          
          ENDSSH